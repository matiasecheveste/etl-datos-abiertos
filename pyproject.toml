[project]
name = "etl-datos-abiertos"
version = "1.0.0"
description = "ETL de precios de combustibles del Catálogo de Datos Abiertos de Uruguay con pandas y SQLite"
authors = [{ name = "Matías Nicolás Echeveste Cardozo" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
